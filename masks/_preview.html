<style>body{margin:0;background:#ac242e;font:11px/1.5 monospace;color:#f2e9e4;padding:12px}

<div class="row" id="r"></div><script>
const R={'9x16':0.5625,'16x9':1.7778,'4x5':0.8,'1x1':1};const H=300;let h='';
for(const k of ['9x16','4x5','16x9','1x1'])for(const n of [1,2,3])

r.innerHTML=h;</script>
